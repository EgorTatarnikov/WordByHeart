language: en
paths:
  work: ../data/work/demo_en
  cache: ../data/cache
  output: ../data/output/demo_en
nlp:
  model: en_core_web_trf
  batch_size: 4
  chunk_size: 5000
pronunciation:
  enabled: true
  language: en-gb
translation:
  cumulative_coverage_limit: 90
  specificity_threshold: 20.0
  min_book_occurrences: 4
machine_translation:
  enabled: false
  provider: openai
  model: gpt-5.6-luna
cards:
  enabled: true
  template: ../table.docx
  output_filename: english_cards.docx
known_dictionary:
  enabled: true
  path: ../my_dictionary_en.xlsx
