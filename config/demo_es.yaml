language: es
paths:
  work: ../data/work/demo_es
  cache: ../data/cache
  output: ../data/output/demo_es
nlp:
  model: es_dep_news_trf
  batch_size: 4
  chunk_size: 5000
pronunciation:
  enabled: true
  language: es
translation:
  cumulative_coverage_limit: 90
  specificity_threshold: 20.0
  min_book_occurrences: 4
machine_translation:
  enabled: false
  provider: openai
  model: gpt-5.6-luna
cards:
  enabled: true
  template: ../table.docx
  output_filename: spanish_cards.docx
known_dictionary:
  enabled: true
  path: ../my_dictionary_es.xlsx
